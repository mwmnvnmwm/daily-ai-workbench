<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>日常与 AI Agent 协同工作台 (账号云同步版)</title>
  <link rel="stylesheet" href="./workbench.css?v=dbbf73009292">
  <style>
    body { font-family: "Inter", -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col">
  <div id="app" class="flex-1 flex flex-col"></div>
  <div id="toast-container" class="fixed bottom-5 right-5 z-50"></div>
  <script>
    const cloudCfg = {enabled:true, lastSyncText:"账号云同步"};
    const THIRTY_DAYS_MS = 30 * 24 * 60 * 60 * 1000;
    const INITIAL_DATA = {"projects":[],"agents":[],"tasks":[],"taskEntries":[],"dailyRecords":[],"trashItems":[]};
    const DAILY_CATEGORIES = ["工作日志", "灵感速记", "会议纪要", "问题复盘", "待办规划"];
    const STATUS_META = {
      active: { key: "active", label: "开启", badgeClass: "bg-emerald-50 text-emerald-700 border-emerald-200", dotClass: "bg-emerald-500", btnActiveClass: "bg-emerald-600 text-white", columnBg: "bg-emerald-50/40 border-emerald-200", colorHex: "#059669", bgHex: "#ecfdf5" },
      paused: { key: "paused", label: "暂停", badgeClass: "bg-amber-50 text-amber-700 border-amber-200", dotClass: "bg-amber-500", btnActiveClass: "bg-amber-500 text-white", columnBg: "bg-amber-50/40 border-amber-200", colorHex: "#d97706", bgHex: "#fffbeb" },
      completed: { key: "completed", label: "完成", badgeClass: "bg-indigo-50 text-indigo-700 border-indigo-200", dotClass: "bg-indigo-600", btnActiveClass: "bg-indigo-600 text-white", columnBg: "bg-indigo-50/40 border-indigo-200", colorHex: "#4f46e5", bgHex: "#eef2ff" }
    };

    let state = INITIAL_DATA;

    function fmt(ts) {
      const d = new Date(ts);
      if (Number.isNaN(d.getTime())) return "";
      const p = n => String(n).padStart(2, "0");
      return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + " " + p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
    }
    function fmtDateInput(ts) {
      const d = new Date(ts);
      if (Number.isNaN(d.getTime())) return "";
      const p = n => String(n).padStart(2, "0");
      return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
    }
    function esc(str) {
      return String(str == null ? "" : str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
    function getRem(deletedAt) {
      const diff = (deletedAt + THIRTY_DAYS_MS) - Date.now();
      if (diff <= 0) return { days: 0, hours: 0, percent: 0 };
      return {
        days: Math.floor(diff / 86400000),
        hours: Math.floor((diff % 86400000) / 3600000),
        percent: Math.min(100, Math.max(2, Math.round((diff / THIRTY_DAYS_MS) * 100)))
      };
    }

    let ui = {
      activeTab: "agent_workspace",
      showLeftSidebar: false,
      taskViewMode: "list",
      selectedAgentFilter: "all",
      selectedProjectFilter: "all",
      statusFilter: "all",
      taskSearchQuery: "",
      taskInitialStatus: "active",
      editingAgentId: null,
      editingProjectId: null,
      editingTaskId: null,
      editingDailyId: null,
      expandedTaskIds: {},
      openNoteTaskIds: {},
      statusNoteMap: {},
      dailyCategoryFilter: "all",
      dailySearch: "",
      trashFilter: "all",
      exportStartDate: fmtDateInput(Date.now() - 7 * 86400000),
      exportEndDate: fmtDateInput(Date.now()),
      exportProjectFilter: "all",
      exportAgentFilter: "all",
      exportScope: "all",
      exportFormat: "pdf",
      previewImageUrl: "",
      showBackupModal: false
    };

    function showToast(msg) {
      const box = document.getElementById("toast-container");
      if (!box) return;
      box.innerHTML = `<div class="bg-slate-900 text-white px-4 py-3 rounded-xl shadow-lg border border-slate-700 text-xs sm:text-sm flex items-center gap-3"><span>✨ ${esc(msg)}</span></div>`;
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => { box.innerHTML = ""; }, 3200);
    }

    function save() {}
    // ---- PDF 1.4 & 2x Canvas 导出引擎 ----
    function dataUrlToUint8Array(dataUrl) {
      const base64 = dataUrl.split(",")[1];
      const bin = atob(base64);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return bytes;
    }
    function buildPdfFromCanvasPages(pageDataUrls, pageDimensions) {
      const encoder = new TextEncoder();
      const chunks = [];
      let offset = 0;
      const offsets = [0];
      const pushStr = s => { const b = encoder.encode(s); chunks.push(b); offset += b.length; };
      const pushBytes = b => { chunks.push(b); offset += b.length; };
      pushStr("%PDF-1.4\n%\xFF\xFF\xFF\xFF\n");
      const numPages = pageDataUrls.length;
      const totalObjects = 2 + numPages * 3;
      offsets[1] = offset;
      pushStr("1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n");
      const kidsRef = pageDataUrls.map((_, i) => (3 + i * 3) + " 0 R").join(" ");
      offsets[2] = offset;
      pushStr("2 0 obj\n<< /Type /Pages /Kids [ " + kidsRef + " ] /Count " + numPages + " >>\nendobj\n");
      for (let i = 0; i < numPages; i++) {
        const pageObjId = 3 + i * 3, imgObjId = 4 + i * 3, contentObjId = 5 + i * 3;
        const { widthPx, heightPx } = pageDimensions[i];
        const pdfW = 595.28, pdfH = Math.round((heightPx / widthPx) * pdfW * 100) / 100;
        offsets[pageObjId] = offset;
        pushStr(pageObjId + " 0 obj\n<< /Type /Page /Parent 2 0 R /Resources << /XObject << /Im" + i + " " + imgObjId + " 0 R >> >> /MediaBox [ 0 0 " + pdfW + " " + pdfH + " ] /Contents " + contentObjId + " 0 R >>\nendobj\n");
        const imgBytes = dataUrlToUint8Array(pageDataUrls[i]);
        offsets[imgObjId] = offset;
        pushStr(imgObjId + " 0 obj\n<< /Type /XObject /Subtype /Image /Width " + widthPx + " /Height " + heightPx + " /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length " + imgBytes.length + " >>\nstream\n");
        pushBytes(imgBytes);
        pushStr("\nendstream\nendobj\n");
        const streamContent = "q\n" + pdfW + " 0 0 " + pdfH + " 0 0 cm\n/Im" + i + " Do\nQ\n";
        const streamBytes = encoder.encode(streamContent);
        offsets[contentObjId] = offset;
        pushStr(contentObjId + " 0 obj\n<< /Length " + streamBytes.length + " >>\nstream\n");
        pushBytes(streamBytes);
        pushStr("endstream\nendobj\n");
      }
      const xrefOffset = offset;
      pushStr("xref\n0 " + (totalObjects + 1) + "\n0000000000 65535 f \n");
      for (let objNum = 1; objNum <= totalObjects; objNum++) {
        pushStr(String(offsets[objNum]).padStart(10, "0") + " 00000 n \n");
      }
      pushStr("trailer\n<< /Size " + (totalObjects + 1) + " /Root 1 0 R >>\nstartxref\n" + xrefOffset + "\n%%EOF");
      return new Blob(chunks, { type: "application/pdf" });
    }

    function getExportData() {
      const startMs = ui.exportStartDate ? new Date(ui.exportStartDate + "T00:00:00").getTime() : 0;
      const endMs = ui.exportEndDate ? new Date(ui.exportEndDate + "T23:59:59.999").getTime() : Number.MAX_SAFE_INTEGER;
      const matchingEntries = ui.exportScope === "daily_only" ? [] : state.taskEntries.filter(e => {
        if (e.timestamp < startMs || e.timestamp > endMs) return false;
        if (ui.exportProjectFilter !== "all" && e.projectId !== ui.exportProjectFilter) return false;
        if (ui.exportAgentFilter !== "all" && e.agentId !== ui.exportAgentFilter) return false;
        return true;
      });
      const matchingTasks = ui.exportScope === "daily_only" ? [] : state.tasks.filter(t => {
        if (t.updatedAt < startMs || t.updatedAt > endMs) return false;
        if (ui.exportProjectFilter !== "all" && t.projectId !== ui.exportProjectFilter) return false;
        if (ui.exportAgentFilter !== "all" && t.agentId !== ui.exportAgentFilter) return false;
        return true;
      });
      const matchingDaily = ui.exportScope === "agent_only" ? [] : state.dailyRecords.filter(d => {
        if (d.timestamp < startMs || d.timestamp > endMs) return false;
        if (ui.exportProjectFilter !== "all" && d.projectId !== ui.exportProjectFilter) return false;
        return true;
      });
      const selectedProjectName = ui.exportProjectFilter === "all" ? "全部项目" : (state.projects.find(p => p.id === ui.exportProjectFilter)?.name || "未分配项目");
      const selectedAgentName = ui.exportAgentFilter === "all" ? "全部 AI Agent" : (state.agents.find(a => a.id === ui.exportAgentFilter)?.name || "未指定 Agent");
      return { matchingEntries, matchingTasks, matchingDaily, selectedProjectName, selectedAgentName };
    }

    function buildMarkdownText() {
      const { matchingEntries, matchingTasks, matchingDaily, selectedProjectName, selectedAgentName } = getExportData();
      const out = [];
      out.push("# 日常工作台 & AI Agent 使用记录导出报告", "");
      out.push("- **导出时间**：" + fmt(Date.now()));
      out.push("- **筛选时间范围**：" + (ui.exportStartDate || "不限") + " 至 " + (ui.exportEndDate || "不限"));
      out.push("- **筛选项目**：" + selectedProjectName);
      out.push("- **筛选 Agent**：" + selectedAgentName);
      out.push("- **统计概览**：AI Agent 任务状态流水 " + matchingEntries.length + " 条 | 活跃任务 " + matchingTasks.length + " 项 | 日常记录 " + matchingDaily.length + " 篇", "");
      if (ui.exportScope !== "daily_only") {
        out.push("## 一、AI Agent 任务状态流转条目 (" + matchingEntries.length + " 条)", "");
        if (matchingEntries.length === 0) {
          out.push("> 当前筛选条件下暂无 AI Agent 任务状态条目。");
        } else {
          out.push("| 记录时间 | 所属 Agent | 所属项目 | 任务名称 | 状态流转动作 | 当前状态 | 备注说明 |");
          out.push("| :--- | :--- | :--- | :--- | :--- | :--- | :--- |");
          matchingEntries.forEach(e => {
            const stLabel = STATUS_META[e.toStatus]?.label || e.toStatus;
            const safeTitle = (e.taskTitle || "").replace(/\|/g, "｜");
            const safeNote = (e.note || "-").replace(/\|/g, "｜").replace(/\n/g, " ");
            out.push("| " + fmt(e.timestamp) + " | " + e.agentName + " | " + e.projectName + " | " + safeTitle + " | " + e.actionType + " | **" + stLabel + "** | " + safeNote + " |");
          });
        }
        out.push("");
      }
      if (ui.exportScope !== "agent_only") {
        out.push("## 二、日常记录归档 (" + matchingDaily.length + " 篇)", "");
        if (matchingDaily.length === 0) {
          out.push("> 当前筛选条件下暂无日常记录。");
        } else {
          matchingDaily.forEach((d, idx) => {
            const projName = state.projects.find(p => p.id === d.projectId)?.name || "通用日常";
            out.push("### " + (idx + 1) + ". " + d.title);
            out.push("- **分类**：" + d.category + " | **关联项目**：" + projName + " | **时间**：" + fmt(d.timestamp), "");
            out.push(d.content || "（无正文内容）", "");
          });
        }
      }
      return out.join("\n");
    }

    function wrapCanvasText(ctx, text, maxWidth) {
      const paragraphs = String(text || "").split("\n");
      const res = [];
      paragraphs.forEach(para => {
        let line = "";
        for (let i = 0; i < para.length; i++) {
          const test = line + para[i];
          if (ctx.measureText(test).width > maxWidth && line.length > 0) {
            res.push(line); line = para[i];
          } else { line = test; }
        }
        res.push(line);
      });
      return res;
    }

    function renderReportCanvases() {
      const { matchingEntries, matchingTasks, matchingDaily, selectedProjectName, selectedAgentName } = getExportData();
      const scale = 2, width = 960, padX = 48, contentW = width - padX * 2;
      const mCanvas = document.createElement("canvas");
      const mCtx = mCanvas.getContext("2d");
      const fontFamily = '"Inter", -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif';
      const drawOps = [];
      let y = 48;
      drawOps.push({
        type: "header", y, h: 148,
        title: "日常工作台 & AI Agent 使用记录报告",
        subtitle: "筛选时间：" + (ui.exportStartDate || "不限") + " 至 " + (ui.exportEndDate || "不限") + "   |   项目：" + selectedProjectName + "   |   Agent：" + selectedAgentName,
        stats: "AI 任务条目：" + matchingEntries.length + " 条    活跃任务：" + matchingTasks.length + " 项    日常记录：" + matchingDaily.length + " 篇    导出时间：" + fmt(Date.now())
      });
      y += 176;
      if (ui.exportScope !== "daily_only") {
        drawOps.push({ type: "section_title", y, h: 36, title: "一、AI Agent 任务状态流转记录 (" + matchingEntries.length + " 条)" });
        y += 44;
        if (matchingEntries.length === 0) {
          drawOps.push({ type: "empty_box", y, h: 56, text: "当前筛选条件下暂无 AI Agent 任务状态条目" });
          y += 72;
        } else {
          matchingEntries.forEach((entry, idx) => {
            mCtx.font = "600 15px " + fontFamily;
            const titleLines = wrapCanvasText(mCtx, (idx + 1) + ". " + entry.taskTitle, contentW - 140);
            mCtx.font = "400 13px " + fontFamily;
            const noteLines = wrapCanvasText(mCtx, "备注：" + (entry.note || "无"), contentW - 36);
            const cardH = 54 + titleLines.length * 22 + noteLines.length * 20;
            drawOps.push({ type: "entry_card", y, h: cardH, entry, titleLines, noteLines });
            y += cardH + 12;
          });
          y += 12;
        }
      }
      if (ui.exportScope !== "agent_only") {
        drawOps.push({ type: "section_title", y, h: 36, title: "二、日常记录归档 (" + matchingDaily.length + " 篇)" });
        y += 44;
        if (matchingDaily.length === 0) {
          drawOps.push({ type: "empty_box", y, h: 56, text: "当前筛选条件下暂无日常记录" });
          y += 72;
        } else {
          matchingDaily.forEach((record, idx) => {
            const projName = state.projects.find(p => p.id === record.projectId)?.name || "通用日常";
            mCtx.font = "600 15px " + fontFamily;
            const titleLines = wrapCanvasText(mCtx, (idx + 1) + ". " + record.title, contentW - 140);
            mCtx.font = "400 13px " + fontFamily;
            const bodyLines = wrapCanvasText(mCtx, record.content || "", contentW - 36);
            const cardH = 52 + titleLines.length * 22 + bodyLines.length * 20;
            drawOps.push({ type: "daily_card", y, h: cardH, record, projName, titleLines, bodyLines });
            y += cardH + 12;
          });
        }
      }
      const totalHeight = Math.max(420, y + 48);
      const renderSlice = (sliceOffsetY, sliceHeight) => {
        const c = document.createElement("canvas");
        c.width = width * scale; c.height = sliceHeight * scale;
        const ctx = c.getContext("2d");
        ctx.scale(scale, scale);
        ctx.fillStyle = "#f8fafc"; ctx.fillRect(0, 0, width, sliceHeight);
        ctx.save(); ctx.translate(0, -sliceOffsetY);
        drawOps.forEach(op => {
          if (op.y + op.h < sliceOffsetY || op.y > sliceOffsetY + sliceHeight) return;
          if (op.type === "header") {
            const grad = ctx.createLinearGradient(padX, op.y, padX + contentW, op.y + op.h);
            grad.addColorStop(0, "#1e1b4b"); grad.addColorStop(1, "#312e81");
            ctx.fillStyle = grad; ctx.beginPath(); ctx.roundRect(padX, op.y, contentW, op.h, 16); ctx.fill();
            ctx.fillStyle = "#ffffff"; ctx.font = "700 24px " + fontFamily; ctx.fillText(op.title, padX + 28, op.y + 46);
            ctx.fillStyle = "#c7d2fe"; ctx.font = "500 13px " + fontFamily; ctx.fillText(op.subtitle, padX + 28, op.y + 84);
            ctx.fillStyle = "#e0e7ff"; ctx.font = "400 13px " + fontFamily; ctx.fillText(op.stats, padX + 28, op.y + 118);
          } else if (op.type === "section_title") {
            ctx.fillStyle = "#4f46e5"; ctx.fillRect(padX, op.y + 4, 5, 22);
            ctx.fillStyle = "#0f172a"; ctx.font = "700 18px " + fontFamily; ctx.fillText(op.title, padX + 14, op.y + 22);
          } else if (op.type === "empty_box") {
            ctx.fillStyle = "#ffffff"; ctx.strokeStyle = "#e2e8f0"; ctx.beginPath(); ctx.roundRect(padX, op.y, contentW, op.h, 10); ctx.fill(); ctx.stroke();
            ctx.fillStyle = "#64748b"; ctx.font = "400 14px " + fontFamily; ctx.fillText(op.text, padX + 20, op.y + 33);
          } else if (op.type === "entry_card") {
            const { entry, titleLines, noteLines } = op;
            const stMeta = STATUS_META[entry.toStatus] || STATUS_META.active;
            ctx.fillStyle = "#ffffff"; ctx.strokeStyle = "#e2e8f0"; ctx.beginPath(); ctx.roundRect(padX, op.y, contentW, op.h, 12); ctx.fill(); ctx.stroke();
            ctx.fillStyle = stMeta.colorHex; ctx.beginPath(); ctx.roundRect(padX, op.y, 6, op.h, [12, 0, 0, 12]); ctx.fill();
            ctx.fillStyle = stMeta.bgHex; ctx.beginPath(); ctx.roundRect(padX + contentW - 108, op.y + 14, 90, 26, 13); ctx.fill();
            ctx.fillStyle = stMeta.colorHex; ctx.font = "600 12px " + fontFamily; ctx.fillText("状态：" + stMeta.label, padX + contentW - 94, op.y + 31);
            ctx.fillStyle = "#0f172a"; ctx.font = "600 15px " + fontFamily;
            let currY = op.y + 28;
            titleLines.forEach(l => { ctx.fillText(l, padX + 20, currY); currY += 22; });
            ctx.fillStyle = "#475569"; ctx.font = "500 12px " + fontFamily;
            ctx.fillText("记录时间：" + fmt(entry.timestamp) + "   |   Agent：" + entry.agentName + "   |   项目：" + entry.projectName + "   |   动作：" + entry.actionType, padX + 20, currY + 2);
            currY += 24; ctx.fillStyle = "#64748b"; ctx.font = "400 13px " + fontFamily;
            noteLines.forEach(l => { ctx.fillText(l, padX + 20, currY); currY += 20; });
          } else if (op.type === "daily_card") {
            const { record, projName, titleLines, bodyLines } = op;
            ctx.fillStyle = "#ffffff"; ctx.strokeStyle = "#e2e8f0"; ctx.beginPath(); ctx.roundRect(padX, op.y, contentW, op.h, 12); ctx.fill(); ctx.stroke();
            ctx.fillStyle = "#0ea5e9"; ctx.beginPath(); ctx.roundRect(padX, op.y, 6, op.h, [12, 0, 0, 12]); ctx.fill();
            ctx.fillStyle = "#f0f9ff"; ctx.beginPath(); ctx.roundRect(padX + contentW - 108, op.y + 14, 90, 26, 13); ctx.fill();
            ctx.fillStyle = "#0284c7"; ctx.font = "600 12px " + fontFamily; ctx.fillText(record.category, padX + contentW - 88, op.y + 31);
            ctx.fillStyle = "#0f172a"; ctx.font = "600 15px " + fontFamily;
            let currY = op.y + 28;
            titleLines.forEach(l => { ctx.fillText(l, padX + 20, currY); currY += 22; });
            ctx.fillStyle = "#475569"; ctx.font = "500 12px " + fontFamily;
            ctx.fillText("记录时间：" + fmt(record.timestamp) + "   |   关联项目：" + projName, padX + 20, currY + 2);
            currY += 24; ctx.fillStyle = "#334155"; ctx.font = "400 13px " + fontFamily;
            bodyLines.forEach(l => { ctx.fillText(l, padX + 20, currY); currY += 20; });
          }
        });
        ctx.restore();
        return c;
      };
      const fullCanvas = renderSlice(0, totalHeight);
      return { fullCanvas, totalHeight, width, scale, renderSlice };
    }

    // ---- 全局交互处理器 ----
    window.switchTab = t => { ui.activeTab = t; if (t === "export_center") { ui.previewImageUrl = renderReportCanvases().fullCanvas.toDataURL("image/png"); } render(); };
    window.toggleSidebar = () => { ui.showLeftSidebar = !ui.showLeftSidebar; render(); };
    window.setTaskView = m => { ui.taskViewMode = m; render(); };
    window.setAgentFilter = id => { ui.selectedAgentFilter = id; render(); };
    window.setProjFilter = id => { ui.selectedProjectFilter = id; render(); };
    window.setStatusFilter = s => { ui.statusFilter = s; render(); };
    window.setInitialStatus = s => { ui.taskInitialStatus = s; render(); };

    window.addAgent = () => {
      const name = document.getElementById("new-agent-input")?.value?.trim();
      const role = document.getElementById("new-agent-role")?.value?.trim();
      if (!name) return showToast("请输入 Agent 名称");
      state.agents.push({ id: "agent-" + Date.now(), name, role: role || "自定义智能体", colorIndex: state.agents.length, createdAt: Date.now() });
      save("已新增 Agent「" + name + "」");
    };
    window.startEditAgent = id => { ui.editingAgentId = id; render(); };
    window.cancelEditAgent = () => { ui.editingAgentId = null; render(); };
    window.saveEditAgent = id => {
      const name = document.getElementById("edit-agent-name-" + id)?.value?.trim();
      const role = document.getElementById("edit-agent-role-" + id)?.value?.trim();
      if (!name) return showToast("Agent 名称不能为空");
      state.agents = state.agents.map(a => a.id === id ? { ...a, name, role } : a);
      state.taskEntries = state.taskEntries.map(e => e.agentId === id ? { ...e, agentName: name } : e);
      ui.editingAgentId = null;
      save("已更新 Agent「" + name + "」");
    };
    window.deleteAgent = id => {
      const ag = state.agents.find(a => a.id === id);
      if (!ag) return;
      state.trashItems.unshift({ trashId: "tr-" + Date.now(), itemType: "agent", title: "Agent：" + ag.name, subtitle: ag.role || "", deletedAt: Date.now(), payload: ag });
      state.agents = state.agents.filter(a => a.id !== id);
      if (ui.selectedAgentFilter === id) ui.selectedAgentFilter = "all";
      save("已将 Agent「" + ag.name + "」移入30天垃圾桶");
    };

    window.addProject = () => {
      const name = document.getElementById("new-proj-input")?.value?.trim();
      if (!name) return showToast("请输入项目名称");
      state.projects.push({ id: "proj-" + Date.now(), name, colorIndex: state.projects.length, createdAt: Date.now() });
      save("已创建项目「" + name + "」");
    };
    window.startEditProj = id => { ui.editingProjectId = id; render(); };
    window.cancelEditProj = () => { ui.editingProjectId = null; render(); };
    window.saveEditProj = id => {
      const name = document.getElementById("edit-proj-name-" + id)?.value?.trim();
      if (!name) return showToast("项目名称不能为空");
      state.projects = state.projects.map(p => p.id === id ? { ...p, name } : p);
      state.taskEntries = state.taskEntries.map(e => e.projectId === id ? { ...e, projectName: name } : e);
      ui.editingProjectId = null;
      save("已更新项目名称为「" + name + "」");
    };

                  <p class="text-xs text-slate-500">自删除起倒计时保留 30 天，期间可随时一键无损还原</p>
                </div>
                <button onclick="purgeExpiredTrash()" class="px-3 py-1.5 rounded-xl border border-rose-200 bg-white text-rose-700 text-xs font-medium">校验并清理超30天项</button>
              </div>
              <div class="divide-y divide-slate-100">
                ${state.trashItems.length === 0 ? `<div class="p-12 text-center text-slate-400 text-sm">当前垃圾桶为空</div>` : state.trashItems.map(item => {
                  const rem = getRem(item.deletedAt);
                  return `<div class="p-4 sm:p-5 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                    <div class="space-y-1">
                      <div class="font-semibold text-sm text-slate-900">${esc(item.title)}</div>
                      <div class="text-xs text-slate-500">${esc(item.subtitle || "")}</div>
                      <div class="text-xs text-rose-600">删除时间：${fmt(item.deletedAt)} · 剩余保存期：${rem.days} 天 ${rem.hours} 小时 / 30 天</div>
                    </div>
                    <div class="flex gap-2 shrink-0">
                      <button onclick="restoreTrash('${item.trashId}')" class="px-3.5 py-1.5 rounded-xl bg-indigo-600 text-white text-xs font-medium">还原</button>
                      <button onclick="deleteTrashPerm('${item.trashId}')" class="px-3 py-1.5 rounded-xl border text-slate-600 hover:text-rose-700 text-xs font-medium">彻底删除</button>
                    </div>
                  </div>`;
                }).join("")}
              </div>
            </div>
          `}
        </main>
      `;
    }
// Runs inside the existing workbench, with cloud operations owned by the account shell.
const HOST_ORIGIN = location.origin;
let accountReady = false;
let liveConnections=[],liveSessions=[],presenceFailed=false;
function updatePresenceDots(){
 for(const b of document.querySelectorAll('.agent-filter-chip')){
  const active=state.tasks.some(t=>t.agentId===b.dataset.agentId&&t.status==='active');
  const dot=b.querySelector('.agent-status-dot');dot.className='agent-status-dot '+(active?'is-active':'is-idle');dot.onclick=null;
  b.title=active?'有进行中的任务':'暂无进行中的任务';b.setAttribute('aria-label',b.textContent+'：'+b.title);
 }
 for(const agentId of new Set(liveConnections.map(c=>c.agent_id))){
  const connections=liveConnections.filter(c=>c.agent_id===agentId);
  const connection=connections[0];
  const button=[...document.querySelectorAll('.agent-filter-chip')].find(e=>e.dataset.agentId===connection.agent_id);
  if(!button)continue;
  const sessions=liveSessions.filter(s=>connections.some(c=>c.id===s.connection_id));
  const fresh=sessions.filter(s=>Date.now()-Date.parse(s.updated_at)<300000);
  let status='unknown';
  if(!presenceFailed&&fresh.length){
   status=fresh.some(s=>s.status==='working')?'working':fresh.some(s=>s.status==='waiting')?'waiting':fresh.some(s=>s.status==='unknown')||sessions.some(s=>s.status!=='offline'&&!fresh.includes(s))||connections.some(c=>!sessions.some(s=>s.connection_id===c.id))?'unknown':fresh.some(s=>s.status==='idle')?'idle':'offline';
  }
  const labels={working:'工作中',waiting:'等待授权',idle:'空闲',offline:'已断开',unknown:'未连接或状态待确认'};
  const last=sessions.length?Math.max(...sessions.map(s=>Date.parse(s.updated_at))):null;
  const devices=connections.filter(c=>fresh.some(s=>s.connection_id===c.id&&s.status==='working')).map(c=>c.device_name).filter(Boolean);
  const description=(connection.provider==='grokbot'?'GrokBot':connection.provider==='cursor'?'Cursor':connection.provider==='kimi-work'?'Kimi Work（仅 Work，Chat 未接入）':connection.provider==='workbuddy'?'WorkBuddy':connection.provider==='gemini-browser'?'Gemini 网页':connection.provider==='chatgpt-browser'?'ChatGPT 网页':'Codex')+'状态：'+labels[status]+(devices.length?'；工作设备：'+devices.join('、'):'')+(last?'；最后更新 '+new Date(last).toLocaleString():'；等待首次连接');
  const dot=button.querySelector('.agent-status-dot');dot.className='agent-status-dot live-'+status;
  dot.onclick=event=>{event.stopPropagation();showToast(description);};
  button.title=description;button.setAttribute('aria-label',button.textContent+'：'+description);
 }
}
setInterval(updatePresenceDots,5000);
const post = (type, extra = {}) => parent.postMessage({channel: 'daily-account-v1', type, ...extra}, HOST_ORIGIN);
const originalRender = render;
const updateHeaderHeight = () => {
  const header = document.querySelector('.workbench-header');
  if (header) document.documentElement.style.setProperty('--workbench-header-height', header.getBoundingClientRect().height + 'px');
};
const headerObserver = new ResizeObserver(updateHeaderHeight);
const mobileTaskLayout = matchMedia('(max-width: 640px)');
let taskDialogOpen = false;
let managementDialogOpen = false;
let managementFeedback = '';
const taskFieldIds = ['task-title', 'task-note', 'task-agent', 'task-proj'];
let clearTaskDraft = false;
function installManagementDialog() {
  if (!mobileTaskLayout.matches) return;
  const panel = document.getElementById('agent-project-management');
  const launch = document.querySelector('button[onclick="toggleSidebar()"]');
  if (!panel || !launch) return;
  launch.textContent = '管理';
  launch.setAttribute('aria-haspopup', 'dialog');
  launch.setAttribute('aria-expanded', String(managementDialogOpen));
  const titleRow=document.querySelector('.workbench-header h1')?.parentElement;
  if(titleRow){titleRow.classList.add('mobile-title-row');titleRow.append(launch);}
  document.querySelector('.filter-toolbar')?.remove();
  const dialog = document.createElement('dialog');
  dialog.id = 'mobile-management-dialog';
  dialog.setAttribute('aria-labelledby', 'mobile-management-heading');
  dialog.innerHTML = '<div class="mobile-management-header"><h2 id="mobile-management-heading">Agent / 项目管理</h2><button type="button" aria-label="关闭管理">关闭 ×</button></div><p class="mobile-management-feedback" role="status"></p>';
  dialog.querySelector('.mobile-management-feedback').textContent = managementFeedback;
  dialog.append(panel);document.body.append(dialog);
  const close = () => {managementDialogOpen=false;managementFeedback='';dialog.close();launch.setAttribute('aria-expanded','false');post('editing',{active:taskDialogOpen});launch.focus();};
  dialog.querySelector('button').onclick=close;
  dialog.addEventListener('cancel',event=>{event.preventDefault();close();});
  if(managementDialogOpen){dialog.showModal();post('editing',{active:true});}
}
const originalToggleSidebar=window.toggleSidebar;
window.toggleSidebar=()=>{
  if(!mobileTaskLayout.matches){originalToggleSidebar();return;}
  const dialog=document.getElementById('mobile-management-dialog');
  if(!dialog)return;
  managementDialogOpen=true;dialog.querySelector('.mobile-management-feedback').textContent='';dialog.showModal();
  document.querySelector('button[onclick="toggleSidebar()"]').setAttribute('aria-expanded','true');
  post('editing',{active:true});
};
const originalShowToast=showToast;
showToast=function(message){
  if(managementDialogOpen&&mobileTaskLayout.matches){
    managementFeedback=message;
    const feedback=document.querySelector('.mobile-management-feedback');if(feedback)feedback.textContent=message;
  }else originalShowToast(message);
};
function installTaskDialog() {
  if (!mobileTaskLayout.matches) return;
  const input = document.getElementById('task-title');
  if (!input) return;
  const form = input.parentElement.parentElement;
  const launch = document.createElement('button');
  launch.id = 'mobile-add-task'; launch.className = 'mobile-add-task'; launch.textContent = '＋';
  launch.setAttribute('aria-label', '新增任务');
  launch.setAttribute('aria-haspopup', 'dialog');
  document.body.append(launch);
  const dialog = document.createElement('dialog'); dialog.id = 'mobile-task-dialog';
  dialog.setAttribute('aria-labelledby', 'mobile-task-heading');
  dialog.innerHTML = '<div class="mobile-task-dialog-header"><h2 id="mobile-task-heading">新增任务</h2><button type="button" aria-label="关闭新增任务">关闭 ×</button></div><p class="mobile-task-error" role="alert" style="padding:0 16px;color:#be123c;font-size:12px"></p>';
  dialog.append(form); document.body.append(dialog);
  const close = () => {taskDialogOpen = false; dialog.close(); post('editing', {active:false}); launch.focus();};
  dialog.querySelector('button').onclick = close;
  dialog.addEventListener('cancel', event => {event.preventDefault(); close();});
  launch.onclick = () => {taskDialogOpen = true; dialog.showModal(); post('editing', {active:true});};
  if (taskDialogOpen) {dialog.showModal(); post('editing', {active:true});}
}
render = function() {
  const filterScroll = mobileTaskLayout.matches ? [...document.querySelectorAll('.filter-options')].map(el => el.scrollLeft) : [];
  const oldDialog = document.getElementById('mobile-task-dialog');
  const oldManagementDialog = document.getElementById('mobile-management-dialog');
  const managementScroll = oldManagementDialog?.scrollTop || 0;
  const draft = !clearTaskDraft && (mobileTaskLayout.matches || oldDialog) ? Object.fromEntries(taskFieldIds.map(id => [id,document.getElementById(id)?.value])) : null;
  oldDialog?.remove();
  document.getElementById('mobile-add-task')?.remove();
  oldManagementDialog?.remove();
  const sidebarVisible=ui.showLeftSidebar;
  const desktopTaskView=ui.taskViewMode;
  if(mobileTaskLayout.matches){ui.showLeftSidebar=true;ui.taskViewMode='list';}
  try{originalRender();}finally{ui.showLeftSidebar=sidebarVisible;ui.taskViewMode=desktopTaskView;}
  if(mobileTaskLayout.matches){
    const labels=['Agent','日常','导出','垃圾桶'];
    document.querySelectorAll('.workbench-header nav button').forEach((button,index)=>{button.setAttribute('aria-label',button.textContent.trim());button.textContent=labels[index];});
  }
  installTaskDialog();
  installManagementDialog();
  updatePresenceDots();
  const newManagementDialog=document.getElementById('mobile-management-dialog');
  if(newManagementDialog)newManagementDialog.scrollTop=managementScroll;
  document.querySelectorAll('.filter-options').forEach((el,index) => {if(filterScroll[index] !== undefined)el.scrollLeft=filterScroll[index];});
  if (draft) for (const [id,value] of Object.entries(draft)) {const el=document.getElementById(id);if(el && value!==undefined)el.value=value;}
  headerObserver.disconnect();
  const header = document.querySelector('.workbench-header');
  if (header) headerObserver.observe(header);
  updateHeaderHeight();
};
mobileTaskLayout.addEventListener('change', () => {if(accountReady)render();});
const originalAddTask = window.addTask;
window.addTask = () => {
  const dialog = document.getElementById('mobile-task-dialog');
  if (dialog?.open) {
    const title = document.getElementById('task-title'), agent = document.getElementById('task-agent');
    if (!title.value.trim() || !agent.value) {
      dialog.querySelector('.mobile-task-error').textContent = !title.value.trim() ? '请填写任务名称。' : '请先关闭弹窗，在 Agent/项目管理中添加一个 Agent。';
      if (!title.value.trim()) title.focus();
      return;
    }
  }
  const count = state.tasks.length;
  clearTaskDraft = true;
  const wasOpen = taskDialogOpen;
  taskDialogOpen = false;
  try {originalAddTask();} finally {clearTaskDraft = false;}
  if (state.tasks.length === count) taskDialogOpen = wasOpen;
  else {post('editing', {active:false});document.getElementById('mobile-add-task')?.focus();}
};
window.setInitialStatus = status => {
  const fields = ['task-title', 'task-note', 'task-agent', 'task-proj'];
  const draft = Object.fromEntries(fields.map(id => [id, document.getElementById(id)?.value]));
  ui.taskInitialStatus = status;
  render();
  for (const [id, value] of Object.entries(draft)) {
    const input = document.getElementById(id);
    if (input && value !== undefined) input.value = value;
  }
};
window.addEventListener('message', event => {
  if (event.origin !== HOST_ORIGIN || event.source !== parent || event.data?.channel !== 'daily-account-v1') return;
  if(event.data.type==='presence'){liveConnections=event.data.connections;liveSessions=event.data.sessions;presenceFailed=false;updatePresenceDots();}
  if(event.data.type==='presence-error'){presenceFailed=true;updatePresenceDots();}
  if (event.data.type === 'load') {
    state = event.data.data;
    accountReady = true;
    render();
  }
});
save = function(message) {
  if (!accountReady) return;
  post('change', {data: state});
  if (message) showToast(message);
  render();
};
window.toggleCloudModal = () => post('sync');
window.clearDemoData = () => showToast('请通过任务、记录和垃圾桶管理你的数据');
window.addEventListener('focusin', event => { if (event.target.matches('input,textarea,select')) post('editing', {active: true}); });
window.addEventListener('focusout', () => post('editing', {active: mobileTaskLayout.matches && (taskDialogOpen || managementDialogOpen)}));
post('ready');

  </script>
</body>
</html>
